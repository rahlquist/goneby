[project]
name = "goneby-hermes-plugin"
version = "1.0.0"
description = "Hermes plugin surface for GoneBy retroactive project memory"
requires-python = ">=3.11"
dependencies = [
    "goneby>=1.0,<2",
    "cryptography>=42.0.0,<51",
    "httpx>=0.27.0,<1",
    "valkey>=6.0.0,<7",
]

[tool.uv.sources]
# The goneby library lives at THIS repository's root, so a clone resolves it
# from the same reviewed tree — no registry, no network, and the library pin
# is the plugin pin. PM rewrites the relative path to the clone's absolute
# location at admission; keep it as "..".
goneby = { path = "..", editable = true }

# Directory plugin: Hermes reads `dependencies` from this file and prepares
# them through PM. There is no importable package here — `register()` lives in
# __init__.py and is loaded by the plugin loader, not via an entry point.
