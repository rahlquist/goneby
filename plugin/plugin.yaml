name: goneby
version: 1.0.0
description: "Retroactive project memory — encrypted per-project WAL capture at every turn, backward-walk filtering against the shipped product, and scoped semantic recall."
author: "rahlquist"
requires_hermes: ">=0.23.0"
requires_env:
  - GONEBY_ENCRYPTION_KEY
provides_tools:
  - wall_append
  - wall_read
  - walk_backward
  - store_memory
  - query_memory
  - goneby_status
  - goneby_project
provides_hooks:
  - pre_llm_call
  - post_compaction
