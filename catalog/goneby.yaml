name: goneby
repo: https://github.com/rahlquist/goneby
sha: <PIN-FILLED-AT-SUBMISSION>            # full 40-hex of the catalog-ready main commit
subdir: plugin
title: GoneBy
description: >-
  Retroactive project memory for LLM agents. Captures every turn into an
  encrypted per-project write-ahead log (zero tokens during work), then at
  project close walks the log backward from the shipped product — using it as
  the oracle — to keep only entries that verifiably contributed, embeds the
  survivors (MRL truncation), and stores them in Valkey or Qdrant for
  semantic search in later sessions. General plugin: coexists with any memory
  provider instead of replacing it.
maintainer: rahlquist
tier: community
category: memory
version: "1.0.0"
requires_hermes: ">=0.23.0"
docs_url: https://github.com/rahlquist/goneby/blob/main/docs/OVERVIEW.md
image: https://raw.githubusercontent.com/rahlquist/goneby/<PIN>/docs/gallery/banner.jpg
screenshots:
  - https://raw.githubusercontent.com/rahlquist/goneby/<PIN>/docs/gallery/screenshot-tape.png
  - https://raw.githubusercontent.com/rahlquist/goneby/<PIN>/docs/gallery/screenshot-verification.png
  - https://raw.githubusercontent.com/rahlquist/goneby/<PIN>/docs/gallery/screenshot-retrieve.png
  - https://raw.githubusercontent.com/rahlquist/goneby/<PIN>/docs/gallery/screenshot-endcard.png
readme: true
platforms: [linux, macos]
capabilities:
  provides_tools:
    - wall_append
    - wall_read
    - walk_backward
    - store_memory
    - query_memory
    - goneby_status
    - goneby_project
  provides_hooks:
    - pre_llm_call
    - post_compaction
  provides_middleware: []
  requires_env:
    - GONEBY_ENCRYPTION_KEY
