[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "goneby"
version = "1.0.0"
description = "Retroactive project memory for LLM agents"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=42.0.0,<51",
    "httpx>=0.27.0,<1",
]

[project.optional-dependencies]
valkey = ["valkey>=6.0.0,<7"]
qdrant = ["qdrant-client>=1.7.0,<2"]
mcp = ["mcp>=1.0.0,<3"]
dev = ["pytest>=8.0.0", "ruff>=0.3.0", "httpx>=0.27.0", "fastapi>=0.110.0", "uvicorn>=0.29.0"]

[project.scripts]
goneby = "goneby.cli.main:main"

[tool.ruff]
line-length = 100
target-version = "py311"
